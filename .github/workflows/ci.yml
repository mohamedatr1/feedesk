name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: feedesk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/feedesk
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/feedesk_test
      SESSION_SECRET: ci-only-session-secret
      APP_ENV: test
      COOKIE_SECURE: "false"
      RASEL_API_KEY: ""
      SEED_ADMIN_PASSWORD: ci-only-temporary-password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: Migration check
        run: |
          alembic upgrade head
          alembic check
      - name: Migration down/up smoke test
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        env:
          UPLOAD_DIR: ${{ runner.temp }}/feedesk-uploads
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
