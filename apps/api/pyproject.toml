[project]
name = "feedesk-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "argon2-cffi>=23.1,<26",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "phonenumbers>=8.13,<9",
    "cryptography>=42,<51",
    "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel.scripts]
build = "python vercel_build.py"
